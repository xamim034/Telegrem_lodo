<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Ludo Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header><div><small>TELEGRAM MINI APP</small><h1>🎲 Ludo Arena</h1></div><span class="coin">🪙 <b id="points">0</b></span></header>
    <section id="lobby" class="panel">
      <h2>Play online</h2>
      <label>Your nickname<input id="name" maxlength="18" placeholder="Enter nickname"></label>
      <label>Players<select id="capacity"><option value="2">2 players</option><option value="4">4 players</option></select></label>
      <button id="create">Create room</button>
      <div class="separator">OR JOIN A ROOM</div>
      <label>Room code<input id="roomCode" maxlength="6" placeholder="ABC123"></label>
      <button id="join" class="secondary">Join room</button>
      <p class="muted">This version uses virtual points only. No deposits, wagers or cash withdrawals.</p>
      <p id="error" class="error"></p>
    </section>
    <section id="game" class="panel hidden">
      <div class="roombar"><span>Room <b id="code"></b></span><span id="status">Waiting…</span></div>
      <div id="players" class="players"></div>
      <div class="board-wrap"><div id="board" class="board"></div></div>
      <div class="controls">
        <div class="dice" id="dice">🎲</div>
        <button id="roll">Roll dice</button>
      </div>
      <p id="hint" class="muted">Waiting for players…</p>
      <button id="leave" class="secondary">Leave view</button>
    </section>
    <footer>Play fair • Have fun • Virtual rewards only</footer>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
