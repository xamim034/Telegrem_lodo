<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#101827">

  <title>Ludo Arena</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="app">

    <header>
      <div>
        <small>TELEGRAM MINI APP</small>
        <h1>🎲 Ludo Arena</h1>
      </div>

      <span class="coin">
        🪙 <b id="points">0</b>
      </span>
    </header>


    <!-- LOBBY -->

    <section id="lobby" class="panel">

      <h2>Play Online</h2>

      <label>
        Your Nickname

        <input
          id="name"
          maxlength="18"
          placeholder="Enter nickname">
      </label>


      <label>
        Select Players

        <select id="capacity">
          <option value="2">2 Players</option>
          <option value="4">4 Players</option>
        </select>
      </label>


      <button id="create">
        🎮 Create Room
      </button>


      <div class="separator">
        OR JOIN A ROOM
      </div>


      <label>
        Room Code

        <input
          id="roomCode"
          maxlength="6"
          placeholder="ABC123">
      </label>


      <button id="join" class="secondary">
        Join Room
      </button>


      <p class="muted">
        Play with friends online!
      </p>

      <p class="muted">
        Virtual coins only. No real-money betting.
      </p>

      <p id="error" class="error"></p>

    </section>


    <!-- GAME -->

    <section id="game" class="panel hidden">

      <div class="roombar">

        <span>
          Room:
          <b id="code"></b>
        </span>

        <span id="status">
          Waiting...
        </span>

      </div>


      <div id="players" class="players"></div>


      <div class="board-wrap">

        <div id="board" class="board"></div>

      </div>


      <div class="controls">

        <div class="dice" id="dice">
          🎲
        </div>

        <button id="roll">
          Roll Dice
        </button>

      </div>


      <p id="hint" class="muted">
        Waiting for players...
      </p>


      <button id="leave" class="secondary">
        Leave View
      </button>

    </section>


    <footer>
      Ludo Arena • Play Fair • Have Fun
    </footer>

  </main>


  <script src="/socket.io/socket.io.js"></script>

  <script src="/app.js"></script>

</body>

</html>
